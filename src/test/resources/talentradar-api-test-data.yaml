roleBasedProtected:
  admin:
    - request:
        role: manager
      expected:
        status: 401
        schema: schemas/common/accessDenied.json
    - request:
        role: developer
      expected:
        status: 401
        schema: schemas/common/accessDenied.json
  manager:
    - request:
        role: admin
      expected:
        status: 401
        schema: schemas/common/accessDenied.json
    - request:
        role: developer
      expected:
        status: 401
        schema: schemas/common/accessDenied.json
  developer:
    - request:
        role: manager
      expected:
        status: 401
        schema: schemas/common/accessDenied.json
    - request:
        role: admin
      expected:
        status: 401
        schema: schemas/common/accessDenied.json

authForInactiveOrDeletedUser:
  - claims:
      id: dd18d554-1d34-4798-9265-97e91b645abe
      email: already_deleted_user_email@example.com
      name: Already Deleted User
      role: ADMIN
    expected:
      status: 401
      schema: schemas/auth/unauthorized.json
  - claims:
      id: ${INACTIVE_ADMIN_ID}
      email: ${INACTIVE_ADMIN_EMAIL}
      name: Inactive Admin
      role: ADMIN
    expected:
      status: 401
      schema: schemas/auth/unauthorized.json
  - claims:
      id: ${INACTIVE_MANAGER_ID}
      email: ${INACTIVE_MANAGER_EMAIL}
      name: Inactive Manager
      role: MANAGER
    expected:
      status: 401
      schema: schemas/auth/unauthorized.json
  - claims:
      id: ${INACTIVE_DEVELOPER_ID}
      email: ${INACTIVE_DEVELOPER_EMAIL}
      name: Inactive Developer
      role: DEVELOPER
    expected:
      status: 401
      schema: schemas/auth/unauthorized.json

login:
  succeeded:
    - desc: admin
      request:
        email: ${ADMIN_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 200
        role: ADMIN
        schema: schemas/auth/loggedIn.json
    - desc: manager
      request:
        email: ${MANAGER_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 200
        role: MANAGER
        schema: schemas/auth/loggedIn.json
    - desc: developer
      request:
        email: ${DEVELOPER_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 200
        role: DEVELOPER
        schema: schemas/auth/loggedIn.json
  failed:
    - desc: inactive admin user
      request:
        email: ${INACTIVE_ADMIN_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 401
        schema: schemas/auth/unauthorized.json
    - desc: inactive manager user
      request:
        email: ${INACTIVE_MANAGER_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 401
        schema: schemas/auth/unauthorized.json
    - desc: inactive developer user
      request:
        email: ${INACTIVE_DEVELOPER_EMAIL}
        password: ${ANY_USER_PASS}
      expected:
        status: 401
        schema: schemas/auth/unauthorized.json
    - desc: wrong password
      request:
        email: ${ADMIN2_EMAIL}
        password: WrongPass
      expected:
        status: 401
        schema: schemas/auth/unauthorized.json
    - desc: wrong email
      request:
        email: developer@talentradar
        password: ${ANY_USER_PASS}
      expected:
        status: 401
        schema: schemas/auth/unauthorized.json

registration:
  succeeded:
    sendInvite:
      - request:
          roleId: ${DEVELOPER_ROLE_ID}
        expected:
          status: 201
          role: DEVELOPER
          schema: schemas/users/registration/userCreated.json
      - request:
          roleId: ${MANAGER_ROLE_ID}
        expected:
          status: 201
          role: MANAGER
          schema: schemas/users/registration/userCreated.json
      - request:
          roleId: ${ADMIN_ROLE_ID}
        expected:
          status: 201
          role: ADMIN
          schema: schemas/users/registration/userCreated.json
    acceptInvite:
      - sendInvite:
          request:
            roleId: ${ADMIN_ROLE_ID}
          expected:
            status: 201
            role: ADMIN
            schema: schemas/users/registration/userCreated.json
        request:
          fullName: TestUser Admin
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 200
          schema: schemas/users/registration/registrationComplete.json
      - sendInvite:
          request:
            roleId: ${MANAGER_ROLE_ID}
          expected:
            status: 201
            role: MANAGER
            schema: schemas/users/registration/userCreated.json
        request:
          fullName: TestUser Manager
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 200
          schema: schemas/users/registration/registrationComplete.json
      - sendInvite:
          request:
            roleId: ${DEVELOPER_ROLE_ID}
          expected:
            status: 201
            role: DEVELOPER
            schema: schemas/users/registration/userCreated.json
        request:
          fullName: TestUser Developer
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 200
          schema: schemas/users/registration/registrationComplete.json
  failed:
    alreadyChangedUser:
      - desc: already confirmed admin
        claims:
          id: ${ADMIN2_ID}
          email: ${ADMIN2_EMAIL}
          roleId: ${ADMIN_ROLE_ID}
        request:
          fullName: Already confirmed TestAdmin
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 403
          schema: schemas/users/registration/invalidInvite.json
      - desc: already confirmed manager
        claims:
          id: ${MANAGER2_ID}
          email: ${MANAGER2_EMAIL}
          roleId: ${MANAGER_ROLE_ID}
        request:
          fullName: Already confirmed TestManager
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 403
          schema: schemas/users/registration/invalidInvite.json
      - desc: already confirmed developer
        claims:
          id: ${DEVELOPER2_ID}
          email: ${DEVELOPER2_EMAIL}
          roleId: ${DEVELOPER_ROLE_ID}
        request:
          fullName: Already confirmed TestDeveloper
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 403
          schema: schemas/users/registration/invalidInvite.json
      - desc: already deleted user
        claims:
          id: 3626e000-ba11-11dc-3409-b21b07263409
          email: deleted_user_email@example.com
          roleId: ${DEVELOPER_ROLE_ID}
        request:
          fullName: Deleted TestUser
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 403
          schema: schemas/users/registration/invalidInvite.json
      - desc: user registered with developer role but later changed to managerial
        claims:
          id: ${INACTIVE_MANAGER_ID}
          email: ${INACTIVE_MANAGER_EMAIL}
          roleId: ${DEVELOPER_ROLE_ID}
        request:
          fullName: RegisteredAsDeveloper UpgradedToManagerial
          password: ${ANY_USER_PASS}
          confirmPassword: ${ANY_USER_PASS}
        expected:
          status: 403
          schema: schemas/users/registration/invalidInvite.json
    validation:
      sendInvite:
        - desc: email already exists
          request:
            email: ${DEVELOPER2_EMAIL}
            roleId: ${DEVELOPER_ROLE_ID}
          expected:
            status: 403
            schema: schemas/users/registration/unprocessable.json
        - desc: email already exists
          request:
            email: ${INACTIVE_DEVELOPER_EMAIL}
            roleId: ${DEVELOPER_ROLE_ID}
          expected:
            status: 403
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid email
          request:
            email: testuser17@example
            roleId: ${DEVELOPER_ROLE_ID}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid roleId
          request:
            email: testuser17@example.com
            roleId: wrong-role-id-3215
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: missing field - email
          request:
            roleId: ${DEVELOPER_ROLE_ID}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: missing field - roleId
          request:
            email: testuser17@example.com
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
      acceptInvite:
        - desc: missing field - fullName
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            password: ${ANY_USER_PASS}
            confirmPassword: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: missing field - password
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: testUser WithNoPass
            confirmPassword: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: missing field - confirmPassword
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: User WithoutConfirmPass
            password: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid password - mismatch confirmPassword
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: User WithMismatchedPass
            password: ${ANY_USER_PASS}
            confirmPassword: mismatched-passwords
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid fullName - non-alpha chars
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: User @ James
            password: ${ANY_USER_PASS}
            confirmPassword: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid fullName - empty
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: ""
            password: ${ANY_USER_PASS}
            confirmPassword: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid password - short (< 8 chars)
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: Example TestUser
            password: u8
            confirmPassword: u8
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
        - desc: invalid password - too long (> 24 chars)
          sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: Example TestUser
            password: u8A_jsoaeiowauldskjafoewiuriwoalkfsht392738284dsfaksjdyou
            confirmPassword: u8A_jsoaeiowauldskjafoewiuriwoalkfsht392738284dsfaksjdyou
          expected:
            status: 400
            schema: schemas/users/registration/unprocessable.json
      expiredInvite:
        - sendInvite:
            request:
              roleId: ${DEVELOPER_ROLE_ID}
            expected:
              status: 201
              schema: schemas/users/registration/userCreated.json
          request:
            fullName: Anonymous TestUser
            password: ${ANY_USER_PASS}
            confirmPassword: ${ANY_USER_PASS}
          expected:
            status: 400
            schema: schemas/users/registration/expiredInvite.json

users:
  currentUser:
    - request:
        role: developer
      expected:
        status: 200
        role: DEVELOPER
        schema: schemas/users/currentUser.json
    - request:
        role: manager
      expected:
        status: 200
        role: MANAGER
        schema: schemas/users/currentUser.json
    - request:
        role: admin
      expected:
        status: 200
        role: ADMIN
        schema: schemas/users/currentUser.json